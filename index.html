<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球昼夜交替 3D 演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Microsoft YaHei','PingFang SC',system-ui,-apple-system,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#topBar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);padding:8px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.07);z-index:10;pointer-events:auto}
#topBar h1{font-size:15px;font-weight:600;white-space:nowrap;background:linear-gradient(90deg,#f9d423,#ff4e50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
#topBar .cg{display:flex;align-items:center;gap:8px}
#topBar label{font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap}
#topBar input[type=range]{width:76px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.2);border-radius:2px;outline:none}
#topBar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#f9d423;cursor:pointer}
#topBar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;padding:4px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s;font-family:inherit;white-space:nowrap}
#topBar button:hover{background:rgba(255,255,255,.16)}
#topBar button.active{background:rgba(249,212,35,.22);border-color:#f9d423}
#topBar .seasBtn{padding:3px 9px;font-size:12px;border-radius:6px}
#topBar .seasBtn.active{background:rgba(79,195,247,.2);border-color:#4fc3f7;color:#4fc3f7}
#topBar .sv{font-size:13px;color:#f9d423;min-width:28px;text-align:center}
#cityPanel{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;min-width:200px;max-height:75vh;overflow-y:auto;z-index:10;pointer-events:auto}
#cityPanel .pt{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:8px;letter-spacing:.5px;cursor:pointer}
#cityPanel .pt:hover{color:rgba(255,255,255,.65)}
.city-search{width:100%;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:12px;outline:none;font-family:inherit;margin-bottom:6px}
.city-search::placeholder{color:rgba(255,255,255,.3)}
.city-search:focus{border-color:#f9d423}
#citySearchResult{margin-bottom:4px}
.city-sr{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;font-size:12px;color:rgba(255,255,255,.5);border-radius:4px;transition:background .15s}
.city-sr:hover{background:rgba(255,255,255,.07)}
.city-sr button{background:rgba(249,212,35,.15);border:1px solid rgba(249,212,35,.3);color:#f9d423;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap}
.city-sr button:hover{background:rgba(249,212,35,.25)}
.city-sr small{color:rgba(255,255,255,.3);font-size:10px}
.ci{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:13px;border-radius:4px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s}
.ci:last-child{border-bottom:none}
.ci:hover{background:rgba(255,255,255,.07)}
.ci:active{background:rgba(249,212,35,.12)}
.cd{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.cd.day{background:#f9d423;box-shadow:0 0 8px rgba(249,212,35,.5)}
.cd.night{background:#1a1a3e;border-color:rgba(255,255,255,.1)}
.cd.dawn{background:#ff6b35;box-shadow:0 0 10px rgba(255,107,53,.7)}
.cd.dusk{background:#e74c3c;box-shadow:0 0 6px rgba(231,76,60,.4)}
.cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;flex-shrink:0}
.ci-btn{background:none;border:none;color:rgba(255,255,255,.25);cursor:pointer;padding:2px 3px;font-size:13px;line-height:1;border-radius:3px;flex-shrink:0;transition:.15s}
.ci-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.ci-btn.del:hover{color:#ff4e50;background:rgba(255,78,80,.12)}
.ci-btn.off{opacity:.35}
#infoBox{position:fixed;right:16px;bottom:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;max-width:230px;z-index:10;font-size:12px;line-height:1.7;color:rgba(255,255,255,.65);pointer-events:auto}
#infoBox strong{color:rgba(255,255,255,.9)}
#infoBox .hl{color:#f9d423}
#loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.06);border-top-color:#f9d423;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{margin-top:16px;color:rgba(255,255,255,.4);font-size:14px}
#loading .sub{color:rgba(255,255,255,.2);font-size:12px;margin-top:6px}
#errMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,80,80,.25);border-radius:14px;padding:28px 36px;max-width:460px;text-align:center;display:none}

#errMsg .rb:hover{background:rgba(255,255,255,.2)}

#topBar{max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
#infoBox{bottom:90px;max-width:none;padding:8px 14px;white-space:nowrap}
#infoBox .disc{display:none}

#cityPanel{left:8px;bottom:8px;padding:10px 12px;min-width:155px}
#cityPanel .ci{font-size:12px}
#infoBox{display:none}

// ── Error handling ─────────────────────────────────────────
function showErr(m){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('errText').textContent = m || '未知错误，请刷新重试';
  document.getElementById('errMsg').style.display = 'block';
}
window.addEventListener('unhandledrejection', e => showErr('加载失败：'+(e.reason?.message||'')));
function setLoad(t, s) {
  const a = document.getElementById('loadText'); if(a) a.textContent = t;
  const b = document.getElementById('loadSub');  if(b && s) b.textContent = s;
}

// ── 四季节太阳位置：直射点纬度 = 太阳赤纬，二至时晨昏线与极圈(66.5°)相切 ──
// 地轴在世界系中固定为 (0, cosT, sinT)，给定赤纬 δ 需解 sunDir·axis = sinδ 求仰角
const SUN_R = 8;
// 太阳方向在地球坐标系（以地轴为 Y）内沿固定经线（λ=0）随赤纬移动，再叠加地轴倾角 Rx(TILT) 变换到世界系。
// 保证 δ 变化时直射点沿同一条经线移动，晨昏线始终绕其与赤道的两个交点（地方时 6:00/18:00，固定）旋转。
function sunPosFor(declDeg) {
  const d = declDeg * Math.PI / 180;
  return new THREE.Vector3(
    Math.cos(d) * SUN_R,
    Math.sin(d) * Math.cos(TILT) * SUN_R,
    Math.sin(d) * Math.sin(TILT) * SUN_R
  );
}

function loadImgEl(id) {
  const el = document.getElementById(id);
  if (!el) return Promise.reject('no element');
  if (el.complete && el.naturalWidth > 0) return Promise.resolve(el);
  return el.decode().then(() => el).catch(() => null);
}
// 优先从内嵌 data URI 取纹理（file:// 下 <img> 上传 WebGL 会被 Chrome 拦截），
// 无内嵌文件时回退到 <img> 方式（http(s) 或本地服务器场景）
function loadEmbed(key, fallbackId) {
  const src = window.TEX_EMBED && window.TEX_EMBED[key];
  if (!src) return fallbackId ? loadImgEl(fallbackId) : Promise.reject('no embed');
  const im = new Image();
  return new Promise((res, rej) => {
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('embed decode failed: ' + key));
    im.src = src;
  });
}

const earthVS = `
  varying vec3 vNormal;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const earthFS = `
  uniform sampler2D dayTex;
  uniform sampler2D specTex;
  uniform vec3 sunDir;
  uniform vec3 nightCol;

  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    vec3 N = normalize(vNormal);
    float ca = dot(N, normalize(sunDir));

    // Day/night blend
    float dayFactor = smoothstep(-0.08, 0.08, ca);

    vec3 texColor = texture(dayTex, vUv).rgb;
    // Non-linear brightening: lift dark pixels (forest) more than bright pixels (desert)
    texColor = pow(texColor, vec3(0.8));
    float specVal = texture(specTex, vUv).r;

    // Day side（1.35 基础增益 + 海面高光 0.4）
    vec3 dayCol = texColor * (1.35 + 0.4 * specVal);

    // Night side
    vec3 nightColOut = nightCol + texColor * 0.035;
    nightColOut += vec3(0.15, 0.12, 0.05) * max(0.0, 1.0 - specVal - 0.5) * 0.12;

    vec3 color = mix(nightColOut, dayCol, dayFactor);

    // Terminator glow
    float glow = clamp(1.0 - abs(ca) * 14.0, 0.0, 1.0);
    glow = glow * glow;
    vec3 glowCol = mix(
      vec3(1.0, 0.5, 0.15),
      vec3(1.0, 0.25, 0.08),
      smoothstep(-0.08, 0.08, ca)
    );
    color += glowCol * glow * 0.4;

    // Atmosphere rim
    float rim = pow(1.0 - abs(ca), 2.0);
    color += vec3(0.15, 0.4, 0.85) * rim * 0.04;

    gl_FragColor = vec4(color, 1.0);
  }
`;

  {

  {

  {

  // ── Polar circles (Arctic 66.5°N / Antarctic 66.5°S) ────
  function makeLatCircle(latDeg, color, opacity) {

  // ── City persistence（localStorage，file:// 下也可用，失败则静默降级）──

  function saveCities() {

  // ── Status computation ────────────────────────────────────
  function compStatus(sd, d) {
    const wp = new THREE.Vector3();
    d.dot.getWorldPosition(wp);
    const n = wp.normalize(), ca = n.dot(sd);
    // Use local tangent rotation in world space to detect morning/evening
    const localPos = d.pos.clone();
    const eps = 0.005;
    const rxLocal = new THREE.Vector3(
      localPos.x*Math.cos(eps)-localPos.z*Math.sin(eps),
      localPos.y,
      localPos.x*Math.sin(eps)+localPos.z*Math.cos(eps)
    );
    const rxWorld = rxLocal.clone().applyMatrix4(d.dot.matrixWorld).normalize();
    const toward = rxWorld.dot(sd) > ca;
    if (ca > 0.12) return 'day';
    if (ca > 0) return toward ? 'day' : 'dusk';
    if (ca > -0.12) return toward ? 'dawn' : 'night';
    return 'night';
  }

  function updateCities() {
    scene.updateMatrixWorld(true);
    const sd = uniforms.sunDir.value;
    cityData.forEach(d => {
      if (!d.visible) return;
      const st = compStatus(sd, d); d._st = st;
      const de = document.getElementById(`cd-${d.id}`);
      if (de) de.className = `cd ${st}`;

      const iq = new THREE.Quaternion();
      spinGroup.getWorldQuaternion(iq).invert();
      const sl = sd.clone().applyQuaternion(iq);
      const noon = Math.atan2(sl.z, sl.x) * 180 / Math.PI;
      let diff = ((d.city.lng - noon) % 360 + 540) % 360 - 180;
      const lh = (12 + diff/15 + 24) % 24;
      const hh = Math.floor(lh), mm = Math.floor((lh-hh)*60);
      const ts = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
      const span = document.getElementById(`cs-${d.id}`);
      if (span) {
        const lbl = { day:'☀白天', night:'🌙夜晚', dawn:'🌅黎明', dusk:'🌇黄昏' };
        span.innerHTML = `${lbl[st]||'—'} <span style="opacity:0.35;font-size:10px">${ts}</span>`;
      }
      const col = { day:0xf9d423, night:0x1a1a3e, dawn:0xff6b35, dusk:0xe74c3c };
      d.dm.color.setHex(col[st]||0xffffff);
      d.lm.opacity = { day:1, night:0.25, dawn:1, dusk:0.65 }[st] || 0.9;
    });

  // ── Animation loop ────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta(), t = performance.now() / 1000;

    // 季节切换：太阳位置平滑过渡（暂停时也可切换，便于定格讲解）
    if (declCur !== declTarget) {
      declCur += (declTarget - declCur) * (1 - Math.exp(-dt * 3.5));
      if (Math.abs(declTarget - declCur) < 0.01) declCur = declTarget;
      const sp = sunPosFor(declCur);
      uniforms.sunDir.value.copy(sp).normalize();
      sunObjects.forEach(o => o.position.copy(sp));
    }

    if (!paused) {
      spinGroup.rotation.y += BASE_SPEED * speedMul * dt * rotDir;
    }

    if (!cityData._lu || t - cityData._lu > 0.2) {
      updateCities(); updateInfoBox(); cityData._lu = t;
    }

    cityData.forEach(d => {
      if (!d.visible) {
        d.dm.opacity = 0; d.dot.scale.setScalar(0);
        d.lm.opacity = 0; return;
      }
      if (d._st === 'dawn') {
        const p = 0.5 + 0.5 * Math.sin(t*3 + d.id*0.7);
        d.dm.opacity = p; d.dot.scale.setScalar(0.7 + 0.3*p);
      } else if (d._st === 'dusk') {
        const p = 0.4 + 0.3 * Math.sin(t*2 + d.id*1.3);
        d.dm.opacity = p; d.dot.scale.setScalar(1);
      } else if (d._st === 'day') {
        d.dm.opacity = 1; d.dot.scale.setScalar(1);
      } else {
        d.dm.opacity = 0.35; d.dot.scale.setScalar(0.65);
      }
    });

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  console.error('Init error:', e);
  showErr('初始化失败：'+(e.message||e));
}
